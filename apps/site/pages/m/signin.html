<header class="phead wrap pl-head">
  <h1>log in on your phone</h1>
  <p class="lede">open Metal on your phone and choose log in to Dusk Cloud. your cloud opens on its own, no code needed.</p>
</header>

<section class="wrap pl" data-pl="signin">
  <div class="pl-card" data-pl-has hidden>
    <p class="pl-label" id="pl-email-label">log in with</p>
    <p class="pl-value pl-email" data-pl-value aria-labelledby="pl-email-label"></p>
  </div>
  <div class="pl-actions">
    <a class="btn dark pl-store" href="{{ios-link}}"><img src="/art/store-apple.png" alt="" width="18" height="22">upstream Dusk Bot on the app store</a>
    <a class="btn light" href="duskbot://signin" data-pl-open>already have it? open Metal</a>
  </div>
  <p class="pl-android"><img src="/art/store-android.png" alt="" width="22" height="25">see the <a href="https://github.com/parasource-si/metal/tree/main/apps/mobile">Metal mobile build instructions</a> for Android and iOS.</p>
</section>
