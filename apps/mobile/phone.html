<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Metal phone preview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 32px 24px; background: #e9e9e9; color: #333; font-family: system-ui, sans-serif; display: grid; align-content: start; justify-items: center; gap: 20px; padding-top: 20px; }
      .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      button { padding: 8px 16px; border: 1px solid #bbb; border-radius: 8px; background: #fafafa; color: #333; font: inherit; cursor: pointer; }
      button[aria-pressed="true"] { background: #333; border-color: #333; color: white; }
      button:focus-visible { outline: 2px solid #555; outline-offset: 3px; }
      .preview { width: 100%; min-width: 0; display: flex; justify-content: center; }
      .frames { display: flex; align-items: flex-start; gap: 48px; width: max-content; transform-origin: top left; }
      figure { margin: 0; text-align: center; flex: none; }
      .phone { box-sizing: content-box; width: var(--width); height: var(--height); border: 12px solid black; border-radius: 62px; overflow: hidden; background: black; }
      .screen { position: relative; width: 100%; height: 100%; border-radius: 54px; overflow: hidden; background: #fcfcfc; }
      .island { position: absolute; width: 126px; height: 37px; top: 11px; left: 50%; transform: translateX(-50%); border-radius: 20px; background: black; z-index: 1; pointer-events: none; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
      figcaption { margin-top: 14px; color: #777; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="toolbar" role="toolbar" aria-label="Phone preview controls">
      <button id="reload" type="button">Reload</button>
      <button id="dark" type="button" aria-pressed="false">Dark</button>
      <button id="pair" type="button" aria-pressed="false">Pair screen</button>
    </div>
    <main class="preview">
      <div id="stage">
        <div class="frames" id="frames">
          <figure>
            <div class="phone" style="--width: 390px; --height: 844px">
              <div class="screen">
                <div class="island" aria-hidden="true"></div>
                <iframe src="/?frame=1&amp;w=390" title="iPhone 16 Pro preview" data-width="390"></iframe>
              </div>
            </div>
            <figcaption>iPhone 16 Pro 390 x 844</figcaption>
          </figure>
          <figure>
            <div class="phone" style="--width: 430px; --height: 932px">
              <div class="screen">
                <div class="island" aria-hidden="true"></div>
                <iframe src="/?frame=1&amp;w=430" title="iPhone 16 Pro Max preview" data-width="430"></iframe>
              </div>
            </div>
            <figcaption>iPhone 16 Pro Max 430 x 932</figcaption>
          </figure>
        </div>
      </div>
    </main>
    <script type="module" src="/src/phone-frame.ts"></script>
  </body>
</html>
