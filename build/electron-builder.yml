appId: bot.dusk.app
productName: Metal
copyright: Copyright © 2026 dusk bot
artifactName: Metal-${version}-${arch}.${ext}

protocols:
  - name: Metal package install
    schemes: [duskbot]
  # links made before the rename (chat history, notifications) still open the app; electron/legacy-names.mjs reads them
  - name: Metal links from before the rename
    schemes: [openmausbot]

publish: null

directories:
  buildResources: build
  output: release

# electron-builder makes copied directories group-writable by default. The
# Linux CUA trust boundary requires root-owned package ancestors to be 0755.
afterPack: ./scripts/after-pack.mjs

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the compiled harness server (tsc → server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE (the agentcal-hq pattern).
files:
  - electron/**
  - "!electron/**/*.test.*"
  # cloud-seal's typescript entry; the app loads deps.bundle.mjs (package:prepare) instead
  - "!electron/seal/deps.ts"
  - "!electron/resources/speech-helper"
  - "!electron/resources/speech-helper.swift"
  - "!electron/resources/speech-helper-Info.plist"
  - "!electron/resources/Dusk Bot Speech.app/**"
  # windows ships it in Resources (win.extraResources): powershell cannot read inside app.asar
  - "!electron/resources/windows-speech.ps1"
  # The Teach a skill recorder is gone, but a machine that once ran
  # `pnpm build:recorder` may still hold its helper build; never ship it.
  - "!electron/resources/recorder-helper"
  - "!electron/resources/recorder-helper.swift"
  - "!electron/resources/recorder-helper-Info.plist"
  - "!electron/resources/Dusk Bot Recorder.app/**"
  - "!**/node_modules/**"
  - package.json
  # the phone relay hub a linked VPS runs; electron/phone-relay.mjs runs it for this computer's own phones
  - apps/link-service/agent.mjs

asar: true

extraResources:
  # Ship the app's own license terms in every desktop distribution.
  - from: LICENSE
    to: licenses/LICENSE.txt
  - from: docs/LICENSING.md
    to: licenses/LICENSING.md
  - from: third_party/openmausbot/OpenMausBot-Apache-2.0.txt
    to: licenses/upstream-Apache-2.0.txt
  - from: third_party/openmausbot/NOTICE
    to: licenses/upstream-NOTICE.txt
  # cloudflared is distributed under Apache-2.0 as a separate executable.
  # the upstream OpenMausBot code uses the same full license text; ship another named
  # copy so the third-party executable's terms remain unambiguous.
  - from: third_party/openmausbot/OpenMausBot-Apache-2.0.txt
    to: licenses/cloudflared-LICENSE.txt
  - from: third_party/cloudflared/README.md
    to: licenses/cloudflared-README.md
  - from: third_party/hpke-js/core-LICENSE.txt
    to: licenses/hpke-core-LICENSE.txt
  - from: third_party/hpke-js/common-LICENSE.txt
    to: licenses/hpke-common-LICENSE.txt
  # The model provider catalog: models.dev data and OpenCode's refresh logic.
  - from: third_party/models-dev/LICENSE
    to: licenses/models-dev-LICENSE.txt
  - from: third_party/opencode/LICENSE
    to: licenses/opencode-LICENSE.txt
  # Code adapted from T3 Code (MIT): the bots' browser egress gate, the Antigravity runtime, citations.
  - from: third_party/t3-code/LICENSE
    to: licenses/t3-code-LICENSE.txt
  # The 1Password SDK and its WebAssembly core (MIT; saved logins from
  # 1Password, staged in the duckdb resource tree). Neither npm package
  # carries its license text, so the upstream file travels here.
  - from: third_party/onepassword-sdk/LICENSE
    to: licenses/1password-sdk-LICENSE.txt
  - from: dist
    to: ui
  - from: dist-server
    to: server
  # the companion sidecar — a separate process because it is the only part
  # of the app that listens off this machine, and it stays off until asked
  - from: dist-companion
    to: companion
  - from: skills
    to: skills
  - from: dist-native/android-platform-tools
    to: android-platform-tools

mac:
  # Two single-arch artifacts rather than one universal binary: the app is
  # architecture-specific, and universal would make users download both halves.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # the dictation helper is a signed background app — Windows and Linux never see it
  extraResources:
    - from: electron/resources/Dusk Bot Speech.app
      to: Dusk Bot Speech.app
    # CUA must live outside ASAR. prepare-cua stages the signed executable and
    # a self-contained JS/native SDK bundle selected for macOS arm64.
    # ${arch} resolves per built arch — each bundle carries its own natives
    - from: dist-native/${arch}/cua-driver
      to: cua-driver
    - from: dist-native/${arch}/cua-sdk
      to: cua-sdk
    - from: dist-native/cloudflared/darwin-${arch}/cloudflared
      to: cloudflared/cloudflared
    # The bots' browser is not in the Mac installer: scripts/pack-browser-part.mjs signs and zips it for the release
    # and pins its size and SHA-256 here; the app downloads and checks it on its first open (server/app-parts.ts).
    - from: dist-native/parts/darwin-${arch}/parts.json
      to: parts.json
    # The Data engine's native modules (DuckDB, resvg; server/data/engine.ts)
    # as a node_modules tree the server requires at runtime; prepare-duckdb
    # stages this arch's slice. The copy names the node_modules directory
    # itself: electron-builder's resource filter drops a root-level
    # node_modules entry of any tree it copies (app-builder-lib util/filter).
    - from: dist-native/duckdb/darwin-${arch}/node_modules
      to: duckdb/node_modules
  extendInfo:
    NSMicrophoneUsageDescription: The microphone is used for voice dictation into the composer.
    NSSpeechRecognitionUsageDescription: Your voice is transcribed on this Mac to type messages for you.
    NSAccessibilityUsageDescription: Accessibility is used when you let a bot control this Mac.
    NSScreenCaptureUsageDescription: Screen Recording lets bots see this Mac before acting.
    NSAppleEventsUsageDescription: Automation lets Metal open Terminal and lets bots control the apps you allow.
    NSDownloadsFolderUsageDescription: Downloads is checked for the notes file another AI saved for you (dusk-bot-notes.json), so it comes in by itself.
  # Notarization runs manually after the build (notarytool + staple),
  # mirroring the BlueyLite ship_release.sh flow.
  notarize: false

dmg:
  sign: true
  # the mounted volume's name in the Finder sidebar and the install window's title bar
  title: Metal
  # ${arch} is load-bearing: without it the x64 dmg silently overwrites
  # the arm64 one when both arches build (this section overrides both the
  # top-level and mac-level artifactName, so it must carry the arch itself)
  artifactName: Metal-${version}-${arch}.dmg
  # x/y are icon centres in points, drawn around by build/dmg/render.mjs.
  # electron-builder 26.15.3 sets the window frame (title bar included) to
  # build/background.png's size and ignores dmg.window whenever a background is
  # set, so the art carries a plain bottom strip the title bar's height.
  iconSize: 112
  iconTextSize: 13
  contents:
    - x: 160
      y: 168
    - x: 440
      y: 168
      type: link
      path: /Applications

win:
  # the portable zip needs its own name: Metal-<version>-x64.zip is the intel mac's updater zip on the same release
  artifactName: Metal-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  icon: build/icon.ico
  extraResources:
    # built-in dictation: Windows PowerShell 5.1 + System.Speech, run by electron/speech.mjs
    - from: electron/resources/windows-speech.ps1
      to: windows-speech.ps1
    - from: dist-native/cloudflared/win32-x64/cloudflared.exe
      to: cloudflared/cloudflared.exe
    - from: dist-native/browser/win32-x64
      to: browser-engine
    - from: dist-native/duckdb/win32-x64/node_modules
      to: duckdb/node_modules
    # CUA driver and SDK for Windows — must live outside ASAR for native modules
    - from: dist-native/cua-win32-x64/cua-driver.exe
      to: cua-driver.exe
    - from: dist-native/cua-win32-x64/cua-driver-background.exe
      to: cua-driver-background.exe
    - from: dist-native/cua-win32-x64/cua-sdk
      to: cua-sdk
  # unsigned windows builds show smartscreen's "unknown publisher" prompt.

nsis:
  differentialPackage: false
  # build/installerSidebar.bmp, uninstallerSidebar.bmp and installerHeader.bmp (node build/art/render.mjs) are picked up
  # by name, but electron-builder 26 shows them only on the assisted installer's pages; oneClick never draws them
  oneClick: true
  perMachine: false
  shortcutName: Metal
  # Versioned, like the .dmg. The README's /latest/download/ button needs a
  # STABLE filename, so ship a second copy named Metal-setup.exe on the
  # release — the same trick as Dusk Bot.dmg beside Metal-${version}.dmg.
  artifactName: Metal-${version}-setup.${ext}

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  # Keep the vector source in the freedesktop scalable icon hierarchy. A
  # lone 1024px PNG is not indexed by GNOME's hicolor theme on Ubuntu 24.04.
  icon: build/icon.svg
  category: Utility
  executableName: duskbot
  synopsis: Your own team of AI bots, in a chat app
  description: A local-first chat app for running a team of AI agents.
  maintainer: dusk bot <hello@dusk.bot>
  vendor: Metal
  syncDesktopName: true
  # The reviewed x64 CLI runtime is staged before packaging and remains
  # outside ASAR so executable modes and adjacent sidecars are preserved.
  extraResources:
    - from: dist-native/cua-linux-x64
      to: cua-linux-x64
    - from: dist-native/cloudflared/linux-x64/cloudflared
      to: cloudflared/cloudflared
    - from: dist-native/browser/linux-x64
      to: browser-engine
    - from: dist-native/duckdb/linux-x64/node_modules
      to: duckdb/node_modules
    - from: build/linux-dusk-browser.apparmor
      to: duskbot-browser.apparmor
    # the icon an AppImage copies into the person's app menu (electron/appimage-menu-entry.mjs)
    - from: build/icon.svg
      to: icon.svg
  # the install folder is /opt/<productName>: package:linux passes -c.productName=dusk-bot, because Chromium splits the
  # setuid sandbox's path on spaces and "/opt/Metal" crashed every launch. the name people see is this one
  desktop:
    entry:
      Name: Metal
      Comment: Your own team of AI bots, in a chat app
      Keywords: AI;Agents;Chat;Productivity;

deb:
  packageName: duskbot
  packageCategory: utils
  priority: optional
  # Add the narrow browser policy's parser without replacing Electron's
  # default shared-library dependencies.
  fpm: ["--depends", "apparmor"]
  # dpkg can preserve legacy directory modes during an upgrade. This
  # idempotent hook repairs only the exact package-owned CUA path.
  afterInstall: build/linux-after-install.sh
  afterRemove: build/linux-after-remove.sh

# Static AppImage runtime: Ubuntu 24.04 can launch it without legacy FUSE 2.
toolsets:
  appimage: "1.0.3"
