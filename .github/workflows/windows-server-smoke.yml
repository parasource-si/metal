# Does the packaged app's background server come up on a fresh Windows machine? Installs a setup.exe silently (the
# published one and one built from this commit), opens the app under a home PC condition (scripts/windows-server-smoke.ps1),
# waits for server.log to show the server ready, then uploads the app's logs. Runs on pushes to hotfix/windows-* and
# exp/windows-smoke* branches, and by hand.
name: Windows server smoke

on:
  workflow_dispatch:
    inputs:
      published_url:
        description: published setup.exe to compare against
        required: false
        default: "https://dusk.bot/releases/0.2.17/DuskBot-0.2.17-setup.exe"
  push:
    branches: ["exp/windows-smoke*", "hotfix/windows-*"]

permissions:
  contents: read

concurrency:
  group: windows-server-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release
      - run: pnpm package:win
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer
          path: release/Metal-*-setup.exe
          if-no-files-found: error
          retention-days: 3

  smoke:
    name: ${{ matrix.source }} (${{ matrix.variant }})
    needs: build
    if: always()
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source: [published, built]
        variant: [clean, "engines,heavy"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the published installer
        if: matrix.source == 'published'
        shell: pwsh
        run: |
          $url = "${{ inputs.published_url }}"
          if (-not $url) { $url = "https://dusk.bot/releases/0.2.17/DuskBot-0.2.17-setup.exe" }
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\setup.exe"
      - name: Take the built installer
        if: matrix.source == 'built'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer
          path: ${{ runner.temp }}/built
      - name: Install, open, wait
        shell: pwsh
        run: |
          $installer = if ("${{ matrix.source }}" -eq "built") { (Get-ChildItem "$env:RUNNER_TEMP\built\*.exe" | Select-Object -First 1).FullName } else { "$env:RUNNER_TEMP\setup.exe" }
          ./scripts/windows-server-smoke.ps1 -Installer $installer -Out "$env:RUNNER_TEMP\smoke" -Variant "${{ matrix.variant }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-${{ matrix.source }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
          retention-days: 7
