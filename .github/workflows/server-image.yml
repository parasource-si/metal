name: Server image

# Publishes the self-hosted server image (deploy/docker/Dockerfile, target `server`) as ghcr.io/<owner>/metal for
# linux/amd64 and linux/arm64: `v<version>` for a release, and `latest` when that release is the newest.
# deploy/docker-compose.yml pulls it anonymously, so the package must be public; the last step fails until it is.
# GitHub starts no workflow from an event its own GITHUB_TOKEN caused, so a release the Release workflow publishes
# itself (publish ticked) needs this run by hand; a draft published from the releases page starts it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.2.15"
        required: true

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  ENGINES: "@anthropic-ai/claude-code @openai/codex"

jobs:
  tag:
    name: Read the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      image: ${{ steps.read.outputs.image }}
      latest: ${{ steps.read.outputs.latest }}
    steps:
      - id: name
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          printf '%s' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || { echo "::error::$TAG is not a release tag (vX.Y.Z)"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.name.outputs.tag }}
          persist-credentials: false
      - id: read
        env:
          TAG: ${{ steps.name.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "v$version" = "$TAG" ] || { echo "::error::$TAG holds package.json version $version"; exit 1; }
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/metal"
          newest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          latest=false
          if [ "$newest" = "$TAG" ]; then latest=true; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "$image:$TAG (latest: $latest)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.arch }}
    needs: tag
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false
      - name: Build linux/${{ matrix.arch }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build --platform "linux/$ARCH" --provenance=false \
            -f deploy/docker/Dockerfile --target server --build-arg ENGINES="$ENGINES" \
            -t metal-server:built --load .
      - name: The server starts and answers its health check
        run: |
          docker run -d --name server --init --shm-size=512m metal-server:built
          for _ in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' server)
            [ "$state" = healthy ] && break
            sleep 3
          done
          docker logs server 2>&1 | tail -n 40
          [ "$state" = healthy ] || { echo "::error::the server image is $state after three minutes"; exit 1; }
          docker exec server node dist-server/metal.js pair --label "image check" >/dev/null
          docker rm -f server >/dev/null
      - name: Push linux/${{ matrix.arch }}
        env:
          IMAGE: ${{ needs.tag.outputs.image }}
          TAG: ${{ needs.tag.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker tag metal-server:built "$IMAGE:$TAG-$ARCH"
          docker push "$IMAGE:$TAG-$ARCH"

  publish:
    name: Publish the multi-arch tags
    needs: [tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          IMAGE: ${{ needs.tag.outputs.image }}
          TAG: ${{ needs.tag.outputs.tag }}
          LATEST: ${{ needs.tag.outputs.latest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          if [ "$LATEST" = true ]; then docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$TAG"; fi
          docker buildx imagetools inspect "$IMAGE:$TAG"
      - name: Servers can pull it without signing in
        env:
          IMAGE: ${{ needs.tag.outputs.image }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: node scripts/check-bot-desktop-published.mjs --image "$IMAGE:$TAG"
