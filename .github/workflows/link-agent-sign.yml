# signs the link agent the link service hands out (apps/link-service/agent.mjs.sig) whenever agent.mjs changes on main,
# so servers that pin the release key (agent.mjs RELEASE_KEYS) take it as a self-update. the key is the repository
# secret DUSK_LINK_RELEASE_KEY (its pem, base64); it never leaves this job.
name: Link agent signature

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/link-service/agent.mjs

permissions:
  contents: write

concurrency:
  group: link-agent-sign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Sign
        env:
          DUSK_LINK_RELEASE_KEY: ${{ secrets.DUSK_LINK_RELEASE_KEY }}
        run: node apps/link-service/release.mjs sign-env
      - name: Commit the signature when it changed
        run: |
          git diff --quiet -- apps/link-service/agent.mjs.sig && exit 0
          git config user.name "Metal release"
          git config user.email "release@dusk.bot"
          git add apps/link-service/agent.mjs.sig
          git commit -m "link agent: signature for $(grep -oE '^export const AGENT_VERSION = "[^"]+"' apps/link-service/agent.mjs | cut -d'"' -f2)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
