name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to release (defaults to the branch this runs from)"
        required: false
        type: string
      publish:
        description: "Publish immediately after assembly (otherwise leave a draft for review)"
        required: false
        type: boolean
        default: false
      ship_without_ci:
        description: "Emergency only: skip waiting for the commit's passing CI check"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: read

jobs:
  prepare:
    name: Pin the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
      should_release: ${{ steps.pin.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: pin
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          current=$(node -p "require('./package.json').version")
          echo "version=$current" >> "$GITHUB_OUTPUT"
          should_release=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git cat-file -e "$BEFORE:package.json" 2>/dev/null || {
              echo "::error::cannot verify the version before this push; refusing to start a release"
              exit 1
            }
            previous=$(git show "$BEFORE:package.json" | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).version))')
            if [ "$previous" = "$current" ]; then
              echo "package.json changed without a version bump; skipping the release"
              should_release=false
            fi
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
      - name: Refuse a release whose bot computer image is not published
        if: steps.pin.outputs.should_release == 'true'
        run: node scripts/check-bot-desktop-published.mjs
      - name: Refuse to overwrite a published canonical release
        if: steps.pin.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$v is already published on $GITHUB_REPOSITORY — bump the version first"
            exit 1
          fi
  ci:
    # Ship only a commit whose code passed `CI` (ci.yml's gate, vitest really
    # run): its own run, a run on a commit with the same tree, or, for a
    # version-only bump, its parent's (scripts/release-ci.mjs, docs/ci.md).
    # The wait overlaps the platform builds, so a green commit costs no time;
    # a red or missing verdict stops the release before any draft exists. Main keeps
    # one CI run going and one waiting, so a burst of merges can replace the
    # release commit's own run: scripts/release-ci.mjs then runs CI on the
    # commit in its own lane (a release-ci/v<version> branch no merge can
    # touch) and deletes that branch afterwards.
    name: CI passed on the release commit
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      # read CI runs, start CI in the release lane, and re-run jobs that
      # never got a runner
      actions: write
      # create and delete the release-ci/v<version> branch
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release-ci.mjs
            scripts/ci-scope.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Wait for the CI check on the pinned commit
        if: ${{ !inputs.ship_without_ci }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release-ci.mjs

  mac:
    name: macOS arm64 + x64 (sign, notarize, staple)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # until the Developer ID certificate is in the repo's secrets the Mac build is ad-hoc signed and not notarized:
      # macOS asks people to allow it once (dusk.bot/download says how), and it can't update itself (docs/releasing.md)
      MAC_SIGNED: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release

      - name: Import the Developer ID certificate into a throwaway keychain
        if: env.MAC_SIGNED == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          # the dmg is signed again after the stapled app goes into it (scripts/mac-dmg-swap-app.sh)
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)
          test -n "$identity" || { echo "::error::no Developer ID Application identity in MAC_CERT_P12_BASE64"; exit 1; }
          echo "MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MAC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Ad-hoc sign the Mac build (no Developer ID certificate yet)
        if: env.MAC_SIGNED != 'true'
        run: |
          echo "::warning title=Mac build not notarized::no Developer ID certificate in the secrets, so the Mac build is ad-hoc signed"
          perl -0pi -e 's/^mac:\n/mac:\n  identity: "-"\n/m' build/electron-builder.yml
          grep -q '^  identity: "-"$' build/electron-builder.yml

      - name: Package both architectures
        # macos-15 runners have 7 GB, so Node's default heap stops near 2 GB; the server typecheck now needs a little more.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Metal's own OAuth clients (shared/native-connectors.json), baked in by scripts/bundle-server.mjs; a missing one
          # leaves that one-click sign-in off
          DUSK_GITHUB_APP_CLIENT_ID: ${{ secrets.DUSK_GITHUB_APP_CLIENT_ID }}
          DUSK_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.DUSK_GOOGLE_DRIVE_CLIENT_ID }}
          DUSK_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.DUSK_GOOGLE_DRIVE_CLIENT_SECRET }}
          DUSK_OAUTH_NOTION_CLIENT_ID: ${{ secrets.DUSK_OAUTH_NOTION_CLIENT_ID }}
          DUSK_OAUTH_NOTION_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_NOTION_CLIENT_SECRET }}
          DUSK_OAUTH_LINEAR_CLIENT_ID: ${{ secrets.DUSK_OAUTH_LINEAR_CLIENT_ID }}
          DUSK_OAUTH_LINEAR_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_LINEAR_CLIENT_SECRET }}
          DUSK_OAUTH_AIRTABLE_CLIENT_ID: ${{ secrets.DUSK_OAUTH_AIRTABLE_CLIENT_ID }}
          DUSK_OAUTH_AIRTABLE_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_AIRTABLE_CLIENT_SECRET }}
          DUSK_OAUTH_TODOIST_CLIENT_ID: ${{ secrets.DUSK_OAUTH_TODOIST_CLIENT_ID }}
          DUSK_OAUTH_TODOIST_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_TODOIST_CLIENT_SECRET }}
          DUSK_OAUTH_CLICKUP_CLIENT_ID: ${{ secrets.DUSK_OAUTH_CLICKUP_CLIENT_ID }}
          DUSK_OAUTH_CLICKUP_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_CLICKUP_CLIENT_SECRET }}
          DUSK_OAUTH_TRELLO_API_KEY: ${{ secrets.DUSK_OAUTH_TRELLO_API_KEY }}
          DUSK_OAUTH_DROPBOX_CLIENT_ID: ${{ secrets.DUSK_OAUTH_DROPBOX_CLIENT_ID }}
        run: pnpm package:mac

      - name: "Gate: the signature must verify BEFORE notarization"
        run: |
          for app in "release/mac-arm64/Metal.app" "release/mac/Metal.app"; do
            codesign --verify --deep --strict "$app"
            bin="$app/Contents/Resources/cloudflared/cloudflared"
            test -x "$bin" || { echo "::error::missing executable $bin"; exit 1; }
            test -f "$app/Contents/Resources/licenses/cloudflared-LICENSE.txt" \
              || { echo "::error::missing cloudflared license in $app"; exit 1; }
            test -f "$app/Contents/Resources/licenses/cloudflared-README.md" \
              || { echo "::error::missing cloudflared provenance in $app"; exit 1; }
            codesign --verify --strict "$bin"
            app_team=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            bin_team=$(codesign -dv --verbose=4 "$bin" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            test -n "$app_team" && test "$bin_team" = "$app_team" || {
              echo "::error::cloudflared is not signed by the app's Developer ID team in $app"; exit 1; }
            test ! -e "$app/Contents/Resources/browser-engine" || { echo "::error::the browser is a downloaded part, not in $app"; exit 1; }
            test -s "$app/Contents/Resources/parts.json" || { echo "::error::missing parts.json in $app"; exit 1; }
            case "$app" in *mac-arm64*) parch=arm64 ;; *) parch=x64 ;; esac
            part="$RUNNER_TEMP/part-$parch/browser-engine"; rm -rf "$part"; mkdir -p "$part"
            ditto -x -k "release/Metal-$(node -p "require('./package.json').version")-browser-darwin-$parch.zip" "$part"
            for browser_bin in "$part/agent-browser" "$part/chrome/"*/chrome-headless-shell; do
              test -x "$browser_bin"
              codesign --verify --strict "$browser_bin"
              browser_team=$(codesign -dv --verbose=4 "$browser_bin" 2>&1 | sed -n 's/^TeamIdentifier=//p')
              test "$browser_team" = "$app_team" || { echo "::error::browser runtime has the wrong signing team"; exit 1; }
            done
            echo "ok: $app"
          done

      - name: "Gate: signed native browser works with an empty home"
        run: |
          case "$(node -p process.arch)" in
            arm64) resources="$PWD/release/mac-arm64/Metal.app/Contents/Resources" ;;
            x64) resources="$PWD/release/mac/Metal.app/Contents/Resources" ;;
            *) exit 1 ;;
          esac
          # the browser is a downloaded part: smoke the signed copy the release ships, unpacked as the app unpacks it
          part="$RUNNER_TEMP/part-$(node -p process.arch)"
          node scripts/smoke-browser-bundle.mjs --resources "$part"
          DUSK_SMOKE_DIST="$resources/server" node scripts/smoke-packaged-server.mjs --browser-bundle "$part/browser-engine"

      - name: "Gate: both packaged servers start and every helper path resolves"
        run: |
          for app in "release/mac-arm64/Metal.app" "release/mac/Metal.app"; do
            res="$app/Contents/Resources"
            # the server tree is plain JS — runnable on the runner's node
            # regardless of the app binary's arch
            DUSK_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs \
              || { echo "::error::packaged server in $app failed to start"; exit 1; }
            node scripts/check-module-scopes.mjs "$res" || exit 1
            node --input-type=module - "$res/server" <<'EOF'
          import { existsSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const server = process.argv[2];
          const { SPAWNED_PROXIES } = await import(pathToFileURL(`${server}/proxy-paths.js`));
          const missing = Object.entries(SPAWNED_PROXIES).filter(([, p]) => !existsSync(p));
          if (missing.length) {
            console.error("unresolved proxies:", missing);
            process.exit(1);
          }
          console.log(`ok: ${Object.keys(SPAWNED_PROXIES).length} proxies resolve in ${server}`);
          EOF
            # the speech helper is a nested signed .app and stays universal
            speech="$res/Dusk Bot Speech.app/Contents/MacOS/speech-helper"
            lipo -archs "$speech" | grep -q "x86_64" || { echo "::error::$speech lacks x86_64"; exit 1; }
            lipo -archs "$speech" | grep -q "arm64" || { echo "::error::$speech lacks arm64"; exit 1; }
            # every other native payload carries only this app's own CPU slice
            expected_arch=x86_64
            case "$app" in *mac-arm64*) expected_arch=arm64 ;; esac
            cloudflared="$res/cloudflared/cloudflared"
            for bin in "$res/cua-driver" "$res/cua-sdk/native/libcua_driver_sdk.dylib" \
              "$res/cua-sdk/native/cua_driver_node_runtime.node" "$res/android-platform-tools/darwin/adb" "$cloudflared"; do
              test "$(lipo -archs "$bin")" = "$expected_arch" || {
                echo "::error::$bin is not the expected $expected_arch executable"; exit 1; }
            done
            if [ "$(uname -m)" = "$expected_arch" ]; then
              "$cloudflared" version | grep -Fq "cloudflared version 2026.10.3 " || {
                echo "::error::$cloudflared has the wrong version"; exit 1; }
            fi
          done

      # the apps first, so each one carries its own ticket inside the dmg and opens offline too; then the dmgs
      # (scripts/release-mac-local.sh does the same on a Mac)
      - name: Notarize and staple, apps then dmgs
        if: env.MAC_SIGNED == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          # empty for an Individual API key, the Issuer ID for a Team key
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          auth=(--key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID")
          test -n "$APPLE_API_ISSUER_ID" && auth+=(--issuer "$APPLE_API_ISSUER_ID")
          notarize() {
            out=$(xcrun notarytool submit "$1" "${auth[@]}" --wait --timeout 2h 2>&1)
            echo "$out" | tail -2
            echo "$out" | grep -q "status: Accepted" && return 0
            id=$(echo "$out" | sed -n 's/^ *id: //p' | head -1)
            test -n "$id" && xcrun notarytool log "$id" "${auth[@]}" || true
            echo "::error::notarization not Accepted for $1"
            return 1
          }
          # stapler fetches the ticket from Apple's CloudKit: the connection drops now and then (error 68), and a
          # ticket can lag notarytool's Accepted verdict by a minute (error 65).
          staple() {
            for attempt in 1 2 3 4 5 6; do
              xcrun stapler staple "$1" && return 0
              echo "stapling $1 failed (attempt $attempt of 6); trying again in 30 s"
              sleep 30
            done
            echo "::error::could not staple $1 after 6 attempts"
            return 1
          }
          v=$(node -p "require('./package.json').version")
          for pair in "arm64:release/mac-arm64" "x64:release/mac"; do
            arch="${pair%%:*}"; app="${pair#*:}/Metal.app"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/app-$arch.zip"
            notarize "$RUNNER_TEMP/app-$arch.zip"
            # a zip cannot be stapled: Gatekeeper finds the browser part's ticket online
            notarize "release/Metal-$v-browser-darwin-$arch.zip"
            staple "$app"
            scripts/mac-dmg-swap-app.sh "release/Metal-$v-$arch.dmg" "$app" "$MAC_SIGN_IDENTITY" "$MAC_KEYCHAIN"
            notarize "release/Metal-$v-$arch.dmg"
            staple "release/Metal-$v-$arch.dmg"
            rm -f "release/Metal-$v-$arch.zip" "release/Metal-$v-$arch.zip.blockmap"
            ditto -c -k --sequesterRsrc --keepParent "$app" "release/Metal-$v-$arch.zip"
          done
          rm "$RUNNER_TEMP/notary.p8"

      - name: "Gate: Gatekeeper accepts what a browser download gets"
        if: env.MAC_SIGNED == 'true'
        run: |
          v=$(node -p "require('./package.json').version")
          for pair in "arm64:release/mac-arm64" "x64:release/mac"; do
            arch="${pair%%:*}"; app="${pair#*:}/Metal.app"; dmg="release/Metal-$v-$arch.dmg"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl -a -vvv -t exec "$app" 2>&1 | tee /dev/stderr | grep -q "source=Notarized Developer ID"
            xcrun stapler validate "$app"
            xcrun stapler validate "$dmg"
            q="$RUNNER_TEMP/quarantined-$arch.dmg"; cp "$dmg" "$q"
            xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;$(uuidgen)" "$q"
            spctl -a -vvv -t open --context context:primary-signature "$q" 2>&1 | tee /dev/stderr | grep -q "source=Notarized Developer ID"
          done

      - name: Stable-named copies for the README's /latest/download links
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Metal-$v-arm64.dmg" release/Metal.dmg
          cp "release/Metal-$v-x64.dmg" release/Metal-intel.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release
      - name: Package
        env:
          # the server typecheck in package:prepare outgrows Node's default ~2 GB heap (both runners have 16 GB)
          NODE_OPTIONS: --max-old-space-size=4096
          # Metal's own OAuth clients (shared/native-connectors.json), baked in by scripts/bundle-server.mjs; a missing one
          # leaves that one-click sign-in off
          DUSK_GITHUB_APP_CLIENT_ID: ${{ secrets.DUSK_GITHUB_APP_CLIENT_ID }}
          DUSK_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.DUSK_GOOGLE_DRIVE_CLIENT_ID }}
          DUSK_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.DUSK_GOOGLE_DRIVE_CLIENT_SECRET }}
          DUSK_OAUTH_NOTION_CLIENT_ID: ${{ secrets.DUSK_OAUTH_NOTION_CLIENT_ID }}
          DUSK_OAUTH_NOTION_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_NOTION_CLIENT_SECRET }}
          DUSK_OAUTH_LINEAR_CLIENT_ID: ${{ secrets.DUSK_OAUTH_LINEAR_CLIENT_ID }}
          DUSK_OAUTH_LINEAR_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_LINEAR_CLIENT_SECRET }}
          DUSK_OAUTH_AIRTABLE_CLIENT_ID: ${{ secrets.DUSK_OAUTH_AIRTABLE_CLIENT_ID }}
          DUSK_OAUTH_AIRTABLE_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_AIRTABLE_CLIENT_SECRET }}
          DUSK_OAUTH_TODOIST_CLIENT_ID: ${{ secrets.DUSK_OAUTH_TODOIST_CLIENT_ID }}
          DUSK_OAUTH_TODOIST_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_TODOIST_CLIENT_SECRET }}
          DUSK_OAUTH_CLICKUP_CLIENT_ID: ${{ secrets.DUSK_OAUTH_CLICKUP_CLIENT_ID }}
          DUSK_OAUTH_CLICKUP_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_CLICKUP_CLIENT_SECRET }}
          DUSK_OAUTH_TRELLO_API_KEY: ${{ secrets.DUSK_OAUTH_TRELLO_API_KEY }}
          DUSK_OAUTH_DROPBOX_CLIENT_ID: ${{ secrets.DUSK_OAUTH_DROPBOX_CLIENT_ID }}
        run: pnpm package:win
      - name: "Gate: bundled browser works with an empty home"
        run: node scripts/smoke-browser-bundle.mjs --resources "${{ github.workspace }}/release/win-unpacked/resources"
      - name: "Gate: packaged Windows server discovers its browser"
        env:
          DUSK_SMOKE_DIST: ${{ github.workspace }}/release/win-unpacked/resources/server
        run: node scripts/smoke-packaged-server.mjs --browser-bundle "${{ github.workspace }}/release/win-unpacked/resources/browser-engine"
      - name: Verify the packaged tree and start the packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          [ -f "$res/server/index.js" ] || { echo "::error::missing server/index.js"; exit 1; }
          [ -f "$res/server/desktop-entry.mjs" ] || { echo "::error::missing server/desktop-entry.mjs"; exit 1; }
          node scripts/check-module-scopes.mjs "$res"
          [ -f "$res/ui/index.html" ] || { echo "::error::missing ui/index.html"; exit 1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || { echo "::error::missing cloudflared.exe"; exit 1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || { echo "::error::missing cloudflared license"; exit 1; }
          [ -f "$res/licenses/cloudflared-README.md" ] || { echo "::error::missing cloudflared provenance"; exit 1; }
          expected=$(node --input-type=module -e "import { CLOUDFLARED_ASSETS } from './scripts/prepare-cloudflared.mjs'; console.log(Object.values(CLOUDFLARED_ASSETS).find((asset) => asset.name === 'cloudflared-windows-amd64.exe').binarySha256)")
          actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
          [ "$actual" = "$expected" ] || { echo "::error::cloudflared hash is $actual"; exit 1; }
          "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.10.3 " || {
            echo "::error::cloudflared has the wrong version"; exit 1; }
          HOME="$RUNNER_TEMP/smoke" USERPROFILE="$RUNNER_TEMP/smoke" DUSK_PORT=21987 \
            node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1 && { kill $pid; exit 0; }
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1
      - name: Stable-named copy
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Metal-$v-setup.exe" release/Metal-setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Ubuntu 24.04 x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: pnpm clean
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - name: Package
        env:
          # the server typecheck in package:prepare outgrows Node's default ~2 GB heap (both runners have 16 GB)
          NODE_OPTIONS: --max-old-space-size=4096
          # Metal's own OAuth clients (shared/native-connectors.json), baked in by scripts/bundle-server.mjs; a missing one
          # leaves that one-click sign-in off
          DUSK_GITHUB_APP_CLIENT_ID: ${{ secrets.DUSK_GITHUB_APP_CLIENT_ID }}
          DUSK_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.DUSK_GOOGLE_DRIVE_CLIENT_ID }}
          DUSK_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.DUSK_GOOGLE_DRIVE_CLIENT_SECRET }}
          DUSK_OAUTH_NOTION_CLIENT_ID: ${{ secrets.DUSK_OAUTH_NOTION_CLIENT_ID }}
          DUSK_OAUTH_NOTION_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_NOTION_CLIENT_SECRET }}
          DUSK_OAUTH_LINEAR_CLIENT_ID: ${{ secrets.DUSK_OAUTH_LINEAR_CLIENT_ID }}
          DUSK_OAUTH_LINEAR_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_LINEAR_CLIENT_SECRET }}
          DUSK_OAUTH_AIRTABLE_CLIENT_ID: ${{ secrets.DUSK_OAUTH_AIRTABLE_CLIENT_ID }}
          DUSK_OAUTH_AIRTABLE_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_AIRTABLE_CLIENT_SECRET }}
          DUSK_OAUTH_TODOIST_CLIENT_ID: ${{ secrets.DUSK_OAUTH_TODOIST_CLIENT_ID }}
          DUSK_OAUTH_TODOIST_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_TODOIST_CLIENT_SECRET }}
          DUSK_OAUTH_CLICKUP_CLIENT_ID: ${{ secrets.DUSK_OAUTH_CLICKUP_CLIENT_ID }}
          DUSK_OAUTH_CLICKUP_CLIENT_SECRET: ${{ secrets.DUSK_OAUTH_CLICKUP_CLIENT_SECRET }}
          DUSK_OAUTH_TRELLO_API_KEY: ${{ secrets.DUSK_OAUTH_TRELLO_API_KEY }}
          DUSK_OAUTH_DROPBOX_CLIENT_ID: ${{ secrets.DUSK_OAUTH_DROPBOX_CLIENT_ID }}
        run: pnpm package:linux
      - name: Verify package contents and metadata
        run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: "Gate: installed browser works with Ubuntu sandbox restrictions"
        run: node scripts/smoke-browser-bundle.mjs --resources "/opt/dusk-bot/resources"
      - name: "Gate: packaged Linux server discovers its browser"
        env:
          DUSK_SMOKE_DIST: /opt/dusk-bot/resources/server
        run: node scripts/smoke-packaged-server.mjs --browser-bundle "/opt/dusk-bot/resources/browser-engine"
      - name: "Gate: packaged server and phone helper load as ES modules"
        run: node scripts/check-module-scopes.mjs "/opt/dusk-bot/resources"
      - name: Smoke the packages
        env:
          DUSK_KEEP_SMOKE_DIR: "1"
          DUSK_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge duskbot || true
      - name: Stable-named copies and checksums
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Metal-$v-amd64.deb" release/Metal-amd64.deb
          cp "release/Metal-$v-x86_64.AppImage" release/Metal.AppImage
          (cd release && sha256sum Metal-$v-amd64.deb Metal-$v-x86_64.AppImage > SHA256SUMS-ubuntu-x64.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS-ubuntu-x64.txt
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble the draft
    needs: [prepare, ci, mac, windows, linux]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-mirror-v${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      # to dispatch the npm, Docker and connector publishes on the new tag
      actions: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Refuse an incomplete installer set
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          required=(
            "Metal-$VERSION-amd64.deb"
            "Metal-$VERSION-arm64.dmg"
            "Metal-$VERSION-arm64.zip"
            "Metal-$VERSION-setup.exe"
            "Metal-$VERSION-x64.dmg"
            "Metal-$VERSION-x64.zip"
            "Metal-$VERSION-browser-darwin-arm64.zip"
            "Metal-$VERSION-browser-darwin-x64.zip"
            "Metal-$VERSION-x86_64.AppImage"
            Metal-amd64.deb Metal-intel.dmg Metal-setup.exe
            Metal.AppImage Metal.dmg SHA256SUMS-ubuntu-x64.txt
          )
          for file in "${required[@]}"; do
            test -s "assets/$file" || { echo "::error::missing or empty release asset: $file"; exit 1; }
          done
          test "$(find assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = "${#required[@]}" || {
            echo "::error::unexpected release asset set"; find assets -maxdepth 1 -type f -print; exit 1; }
      # Generate checksums even when this build has no update-signing key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: src
          persist-credentials: false
          sparse-checkout: |
            package.json
            scripts/release-manifest.ts
            apps/cloud-service/src/release-signing.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Generate release checksums and sign the manifest when configured
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DUSK_RELEASE_SIGNING_KEY: ${{ secrets.DUSK_RELEASE_SIGNING_KEY }}
        run: |
          mkdir -p site
          if [ -n "$DUSK_RELEASE_SIGNING_KEY" ]; then
            cp assets/Metal-"$VERSION"-* site/
            node src/scripts/release-manifest.ts site --version "$VERSION"
            find site -maxdepth 1 -name 'Metal-*' -delete
          else
            node --input-type=module -e 'import { sha256sums } from "./src/scripts/release-manifest.ts"; process.stdout.write(sha256sums("assets"));' > site/SHA256SUMS
          fi
          cp site/SHA256SUMS assets/
          cat site/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('site/SHA256SUMS') != ''
        with:
          name: dusk-site
          path: site/
          if-no-files-found: error
          retention-days: 90
      - name: Create or update the canonical draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          tag="v$VERSION"
          ensure_draft() {
            local repo=$1
            shift
            local attempt delay
            for attempt in 1 2 3 4 5; do
              gh release view "$tag" --repo "$repo" > /dev/null 2>&1 && return 0
              if gh release create "$tag" --repo "$repo" "$@"; then
                return 0
              fi
              # The API can create the release before a transient response
              # failure reaches gh. Recover that success before retrying.
              gh release view "$tag" --repo "$repo" > /dev/null 2>&1 && return 0
              test "$attempt" -lt 5 || {
                echo "::error::could not create $tag in $repo after $attempt attempts"
                return 1
              }
              delay=$((5 << (attempt - 1)))
              echo "::warning::release creation failed for $repo; retrying in ${delay}s ($attempt/5)"
              sleep "$delay"
            done
          }
          ensure_draft "$GITHUB_REPOSITORY" --target "$SHA" \
            --draft --title "Metal $VERSION" --generate-notes
          target=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
          target_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$target" --jq .sha)
          test "$target_sha" = "$SHA" || {
            echo "::error::$tag draft targets $target_sha, not pinned release commit $SHA"
            exit 1
          }
          for file in assets/*; do
            gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done
          # a rerun preserves human edits made while reviewing the canonical
          # draft.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          echo "canonical asset count: $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"

      - name: Prove the draft contains the exact staged bytes
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node --input-type=module - "$VERSION" <<'EOF'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";
          const version = process.argv[2];
          const expected = new Map(readdirSync("assets").map((name) => [
            name,
            `sha256:${createHash("sha256").update(readFileSync(join("assets", name))).digest("hex")}`,
          ]));
          for (const [repo, token] of [
            [process.env.GITHUB_REPOSITORY, process.env.CANONICAL_TOKEN],
          ]) {
            const json = execFileSync("gh", ["release", "view", `v${version}`, "--repo", repo, "--json", "assets"], {
              encoding: "utf8",
              env: { ...process.env, GH_TOKEN: token },
            });
            const assets = JSON.parse(json).assets;
            if (assets.length !== expected.size) throw new Error(`${repo}: expected ${expected.size} assets, got ${assets.length}`);
            for (const asset of assets) {
              if (expected.get(asset.name) !== asset.digest) throw new Error(`${repo}: digest mismatch for ${asset.name}`);
            }
            console.log(`ok: ${repo} has ${assets.length} byte-identical assets`);
          }
          EOF

      - name: Publish (only when asked to)
        if: ${{ inputs.publish }}
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          GH_TOKEN="$CANONICAL_TOKEN" gh release edit "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" --draft=false --latest
          GH_TOKEN="$CANONICAL_TOKEN" gh release view "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -q false
          echo "published v$VERSION; put it on dusk.bot with scripts/publish-downloads.sh v$VERSION (docs/LAUNCH.md)"
