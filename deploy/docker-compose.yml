# One Metal tenant: the harness server plus Caddy for TLS + login.
#
# Caddy runs in the server's network namespace, so it reaches the server on
# 127.0.0.1 — the server never binds a public interface. Ports are therefore
# declared on the `dusk` service (the namespace owner).
#
#   cp .env.example .env   # set DOMAIN
#   docker compose up -d --build                        # build from this checkout
#   docker compose pull dusk && docker compose up -d    # use a published image when available
services:
  dusk:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: server
      args:
        ENGINES: ${ENGINES:-}
    image: ${DUSK_IMAGE:-ghcr.io/parasource-si/metal:latest}
    restart: unless-stopped
    # The bots' browsers (docs/browser-packaging.md, "Process hygiene"): an
    # init collects the browser processes whose parents exit, and Chrome
    # gets the shared memory Metal's desktop containers give it.
    init: true
    shm_size: 512m
    volumes:
      - data:/data
    ports:
      - "80:80"
      - "443:443"
      # the live screen's direct path (WebRTC): the image's DUSK_SCREEN_DIRECT_PORTS, same numbers both sides so the
      # address the server learns from STUN is the one that reaches it. Closed, screens still work over the relay.
      - "30000-30063:30000-30063/udp"
    environment:
      DUSK_PORT: "8799"
      DUSK_WEBHOOK_PORT: "8800"
      # what the app prints as hook URLs — Caddy passes /hooks/* straight through
      DUSK_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
      # pairing links for remote clients point here (docs/self-hosting.md)
      DUSK_PUBLIC_URL: https://${DOMAIN}
      # Who may sign in with an emailed code at /pair (docs/self-hosting.md,
      # "Sign in with your email"). Empty means pairing codes only.
      DUSK_SIGNIN_EMAILS: ${DUSK_SIGNIN_EMAILS:-}
      DUSK_SIGNIN_MEMBER_EMAILS: ${DUSK_SIGNIN_MEMBER_EMAILS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8799/api/health | grep -q duskbot"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: "service:dusk"
    depends_on:
      dusk:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
